[project]
name = "figma2css"
version = "0.1.0"
description = "Claude Code skill that extracts design tokens from a Figma file and outputs CSS :root variables for rapid frontend implementation."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
figma2css = "figma2css.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["figma2css*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
